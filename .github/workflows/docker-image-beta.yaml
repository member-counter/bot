name: Docker Image CI - Beta

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [dev]

jobs:
  pnpm-store-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/pnpm-store-cache:build-cache-beta
          cache-to: type=registry,ref=ghcr.io/member-counter/pnpm-store-cache:build-cache-beta,mode=max
          tags: |
            ghcr.io/member-counter/pnpm-store-cache:beta
  build-frontend:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 builder
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          target: builder
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/frontend:build-cache-beta-amd64
          cache-to: type=registry,ref=ghcr.io/member-counter/frontend:build-cache-beta-amd64,mode=max
          tags: |
            ghcr.io/member-counter/frontend:beta-builder
          build-args: |
            VITE_SUPPORT_URL=${{ vars.VITE_SUPPORT_URL }}
            VITE_BOT_DOCS_URL=${{ vars.VITE_BOT_DOCS_URL }}
            VITE_BOT_REPO_URL=${{ vars.VITE_BOT_REPO_URL }}
            VITE_TRANSLATION_PLATFORM_URL=${{ vars.VITE_TRANSLATION_PLATFORM_URL }}

      - name: Build and push multi-arch runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: runner
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/member-counter/frontend:build-cache-beta-amd64
            type=registry,ref=ghcr.io/member-counter/frontend:build-cache-beta
          cache-to: type=registry,ref=ghcr.io/member-counter/frontend:build-cache-beta,mode=max
          tags: |
            ghcr.io/member-counter/frontend:beta
          build-args: |
            JS_SOURCE_IMAGE=ghcr.io/member-counter/frontend:beta-builder
  build-bot:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 builder
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/bot/Dockerfile
          platforms: linux/amd64
          target: builder
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/bot:build-cache-beta-amd64
          cache-to: type=registry,ref=ghcr.io/member-counter/bot:build-cache-beta-amd64,mode=max
          tags: |
            ghcr.io/member-counter/bot:beta-builder

      - name: Build and push multi-arch runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/member-counter/bot:build-cache-beta-amd64
            type=registry,ref=ghcr.io/member-counter/bot:build-cache-beta
          cache-to: type=registry,ref=ghcr.io/member-counter/bot:build-cache-beta,mode=max
          tags: |
            ghcr.io/member-counter/bot:beta
          build-args: |
            JS_SOURCE_IMAGE=ghcr.io/member-counter/bot:beta-builder
  build-backend:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 builder
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          target: builder
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/backend:build-cache-beta-amd64
          cache-to: type=registry,ref=ghcr.io/member-counter/backend:build-cache-beta-amd64,mode=max
          tags: |
            ghcr.io/member-counter/backend:beta-builder

      - name: Build and push multi-arch runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/member-counter/backend:build-cache-beta-amd64
            type=registry,ref=ghcr.io/member-counter/backend:build-cache-beta
          cache-to: type=registry,ref=ghcr.io/member-counter/backend:build-cache-beta,mode=max
          tags: |
            ghcr.io/member-counter/backend:beta
          build-args: |
            JS_SOURCE_IMAGE=ghcr.io/member-counter/backend:beta-builder
  build-db-utils:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/db/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/db-utils:build-cache-beta
          cache-to: type=registry,ref=ghcr.io/member-counter/db-utils:build-cache-beta,mode=max
          tags: |
            ghcr.io/member-counter/db-utils:beta
