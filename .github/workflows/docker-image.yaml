name: Docker Image CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]

jobs:
  pnpm-store-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/pnpm-store-cache:build-cache
          cache-to: type=registry,ref=ghcr.io/member-counter/pnpm-store-cache:build-cache,mode=max
          tags: |
            ghcr.io/member-counter/pnpm-store-cache:latest
  build-website:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/website:build-cache
          cache-to: type=registry,ref=ghcr.io/member-counter/website:build-cache,mode=max
          tags: |
            ghcr.io/member-counter/website:latest
          build-args: |
            VITE_SUPPORT_URL=${{ vars.VITE_SUPPORT_URL }}
            VITE_BOT_DOCS_URL=${{ vars.VITE_BOT_DOCS_URL }}
            VITE_BOT_REPO_URL=${{ vars.VITE_BOT_REPO_URL }}
            VITE_TRANSLATION_PLATFORM_URL=${{ vars.VITE_TRANSLATION_PLATFORM_URL }}
  build-bot:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: apps/bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/bot:build-cache
          cache-to: type=registry,ref=ghcr.io/member-counter/bot:build-cache,mode=max
          tags: |
            ghcr.io/member-counter/bot:latest
  build-server:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/server:build-cache
          cache-to: type=registry,ref=ghcr.io/member-counter/server:build-cache,mode=max
          tags: |
            ghcr.io/member-counter/server:latest
  build-db-utils:
    runs-on: ubuntu-latest
    needs: pnpm-store-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: packages/db/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/member-counter/db-utils:build-cache
          cache-to: type=registry,ref=ghcr.io/member-counter/db-utils:build-cache,mode=max
          tags: |
            ghcr.io/member-counter/db-utils:latest
